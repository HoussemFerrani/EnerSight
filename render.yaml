# Render deployment for the EnerSight backend.
# Database lives in Supabase, so no Postgres/Redis services are provisioned here.
# Frontend deploys separately (Vercel / Netlify / Cloudflare Pages) — see DEPLOYMENT.md.

services:
  # Backend API - FastAPI on Render's native Python runtime (no Docker).
  - type: web
    name: enersight-backend
    runtime: python
    plan: starter
    region: frankfurt  # match the Supabase project region (eu-central-1)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9

      # Supabase - paste these in the Render dashboard, do NOT commit.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false  # Supabase pooler URL (transaction mode, port 6543)

      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app
