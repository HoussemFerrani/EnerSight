databases:
  # PostgreSQL Database
  - name: enersight-postgres
    databaseName: enersight
    user: enersight_user
    plan: free

services:

  # Redis Cache
  - type: redis
    name: enersight-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # Backend API
  - type: web
    name: enersight-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: POSTGRES_HOST
        fromDatabase:
          name: enersight-postgres
          property: host
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: enersight
      - key: POSTGRES_USER
        value: enersight_user
      - key: POSTGRES_PASSWORD
        fromService:
          tyDatabase:
          name: enersight-postgres
          property: password
        value: https://cloud2.influxdata.com
      - key: INFLUXDB_TOKEN
        sync: false  # Set manually in dashboard
      - key: INFLUXDB_ORG
        value: your-org
      - key: INFLUXDB_BUCKET
        value: energy_data
      - key: REDIS_HOST
        fromService:
          type: redis
          name: enersight-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: enersight-redis
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://enersight.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false  # Set manually
      - key: SMTP_PASSWORD
        sync: false  # Set manually
      - key: EMAIL_FROM
        value: noreply@enersight.com

  # Frontend Static Site
  - type: web
    name: enersight-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://enersight-backend.onrender.com/api/v1
