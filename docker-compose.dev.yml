version: "3.8"

# Development-specific Docker Compose configuration
# Extends the base docker-compose.yml with development overrides

services:
  # Backend with hot-reload and debugging
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder # Use builder stage for development
    volumes:
      # Mount source code for hot-reload
      - ./backend:/app/backend:ro
      - ./ml:/app/ml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
      - "5678:5678" # Debug port

  # Frontend with Vite HMR
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build # Use build stage for development
    volumes:
      # Mount source code for hot-reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - /app/node_modules # Prevent overwriting node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true # For Windows file watching
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:5173" # Vite default port is 5173

  # InfluxDB with persistent config
  influxdb:
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./data/influx-backup:/backup # Mount backup directory
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=enersight
      - DOCKER_INFLUXDB_INIT_BUCKET=energy_data
